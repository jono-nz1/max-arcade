<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutty Bolts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutty Bolts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f1d2b">
<style>
:root{
  --bg:#0f1d2b; --bg2:#16293b; --panel:#1d3550; --line:#2c4a6b;
  --ink:#f3f7fb; --dim:#8ea6bf; --gold:#ffc929; --gold2:#ff9d1f; --ok:#35c46a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{background:
  radial-gradient(circle at 50% 0%,#1c3650 0%,transparent 60%),
  radial-gradient(#22394f 1.6px,transparent 1.8px) 0 0/26px 26px, var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px)}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.wrap{width:100%;max-width:520px;margin:0 auto}

/* ---------- home ---------- */
h1{font-size:40px;line-height:1;margin:14px 0 2px;text-align:center;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,#ffe07a,#ff9d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--dim);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.label{color:var(--dim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:16px 4px 8px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.player{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player.add{border-style:dashed;color:var(--dim)}
.player.first{grid-column:1/-1;padding:18px;font-size:18px;color:var(--gold);border-color:var(--gold)}
.mini{display:block;margin:6px auto 0}
.player small{display:block;color:var(--gold);font-size:12px;font-weight:700;margin-top:2px}
.player.sel{background:var(--panel);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,41,.18)}
.tier{display:flex;align-items:center;width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:8px;text-align:left}
.tier:active,.player:active,.lv:active{transform:scale(.97)}
.tier b{font-size:19px;font-weight:800;flex:1}
.tier span{color:var(--dim);font-size:13px;margin-right:10px}
.tier em{font-style:normal;color:var(--gold);font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;margin-right:12px;flex:none}
.daily{border-color:#3d6fa3;background:linear-gradient(180deg,#22456a,#1a3552)}
.board{font-size:13px;color:var(--dim);margin:-2px 6px 10px;line-height:1.6}
.board b{color:var(--ink)}
.foot{display:flex;gap:14px;justify-content:center;margin:14px 0 6px}
.link{background:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px}

/* ---------- levels ---------- */
.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.round{width:52px;height:52px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:24px;font-weight:900;flex:none;
  display:grid;place-items:center}
.round:active,.act:active{transform:scale(.93)}
.round:disabled,.act:disabled{opacity:.35}
.title{flex:1;text-align:center}
.title small{display:block;color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.title b{font-size:26px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 0 20px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--bg2);border:2px solid var(--line);font-weight:900;font-size:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv small{font-size:11px;color:var(--gold);letter-spacing:1px;height:13px}
.lv.next{border-color:var(--gold);background:var(--panel)}
.lv.lock{opacity:.35}

/* ---------- game ---------- */
#game{padding-left:0;padding-right:0}
#game .bar,#game .acts{padding:0 calc(env(safe-area-inset-left) + 14px)}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.acts{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:84px}
.act{background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--gold);width:84px;position:relative}
.act i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:26px;color:#3a2500;
  background:linear-gradient(180deg,#ffd95a,#ff9d1f);box-shadow:0 4px 0 #b86400}
.act .badge{position:absolute;top:-4px;right:8px;background:#fff;color:#223;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:900}
.moves{flex:1;text-align:center;color:var(--dim);font-size:13px;padding-bottom:22px}
.moves b{display:block;color:var(--ink);font-size:24px;font-weight:900}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translateX(-50%);background:#fff;color:#14202c;
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:86vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#toast.on{opacity:1}

/* ---------- win ---------- */
#win,#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,16,24,.6);z-index:10;padding:20px}
#win.on,#modal.on{display:flex}
#modal{z-index:12}
.card{background:var(--bg2);border:2px solid var(--line);border-radius:26px;padding:24px 22px;width:100%;max-width:340px;text-align:center}
.card h2{margin:0 0 6px;font-size:32px;font-weight:900}
.stars{font-size:46px;letter-spacing:6px;color:#33506e;margin:6px 0}
.stars span{display:inline-block}
.stars .y{color:var(--gold);text-shadow:0 0 18px rgba(255,201,41,.6);animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-140deg);opacity:0}70%{transform:scale(1.45) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#win.on .card,#modal.on .card{animation:cardin .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardin{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
#win.on,#modal.on{animation:dim .3s both}
@keyframes dim{0%{background:rgba(8,16,24,0)}100%{background:rgba(8,16,24,.6)}}
.card p{color:var(--dim);margin:6px 0 16px;font-size:14px;line-height:1.5}
.big{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:18px;color:#3a2500;
  background:linear-gradient(180deg,#ffd95a,#ff9d1f);box-shadow:0 4px 0 #b86400;margin-bottom:12px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #b86400}
.danger{display:block;width:100%;padding:12px;border-radius:16px;background:#5a2230;color:#ffd6dc;font-weight:800;margin-bottom:10px}
.field{width:100%;font:inherit;font-size:20px;font-weight:800;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin:4px 0 6px;outline:none}
.field:focus{border-color:var(--gold)}
.err{color:#ff8c9a;font-size:13px;min-height:18px;margin-bottom:8px}
.prow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.prow b{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800}
.pbtn.red{color:#ff9aa8}
#modal .card{max-height:86vh;overflow-y:auto}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(92vw,440px);background:#fff;color:#14202c;
  padding:12px 16px;border-radius:16px;font-weight:800;font-size:16px;line-height:1.35;text-align:center;z-index:6;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#tip.on{display:block}
#tip small{display:block;color:#5b6b7c;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.ghost{display:block;width:100%;padding:12px;border-radius:16px;background:var(--panel);font-weight:800}
</style>
</head>
<body>

<div class="screen on" id="home">
  <div class="scroll"><div class="wrap">
    <h1 id="logo">Nutty Bolts</h1>
    <div class="sub">Tucker Arcade</div>
    <div class="label">Who's playing?</div>
    <div class="players" id="players"></div>
    <button class="link mini" id="editPlayers">Edit players</button>
    <div class="label">Today</div>
    <button class="tier daily" id="dailyBtn"><div class="dot" style="background:#ffc929"></div><b>Daily puzzle</b><span id="dailyMine"></span><em>▶</em></button>
    <div class="board" id="dailyBoard"></div>
    <div class="label">Levels</div>
    <div id="tiers"></div>
    <div class="foot">
      <button class="link" id="soundBtn"></button>
      <button class="link" id="howBtn">How to play</button>
      <button class="link" id="unlockBtn"></button>
    </div>
  </div></div>
</div>

<div class="screen" id="levels">
  <div class="wrap bar">
    <button class="round" id="lvBack" aria-label="Back">‹</button>
    <div class="title"><small id="lvPlayer"></small><b id="lvTier"></b></div>
    <div style="width:52px"></div>
  </div>
  <div class="scroll"><div class="wrap grid" id="grid"></div></div>
</div>

<div class="screen" id="game">
  <div class="bar">
    <button class="round" id="gBack" aria-label="Back">‹</button>
    <div class="title"><small id="gTier"></small><b id="gLevel"></b></div>
    <button class="round" id="gRestart" aria-label="Restart">↻</button>
  </div>
  <canvas id="cv"></canvas>
  <div class="acts">
    <button class="act" id="undoBtn"><i>↩</i>Undo</button>
    <div class="moves"><b id="moveN">0</b>moves</div>
    <button class="act" id="hintBtn"><i>💡</i>Hint</button>
    <button class="act" id="addBtn"><i>＋</i><span id="addLbl">Extra bolt</span></button>
  </div>
</div>

<div id="toast"></div>
<div id="tip"></div>
<div id="modal"><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="win"><div class="card">
  <h2 id="winTitle">Sorted!</h2>
  <div class="stars" id="winStars"></div>
  <p id="winText"></p>
  <button class="big" id="winNext">Next level</button>
  <button class="ghost" id="winMenu">Back to levels</button>
</div></div>

<script>
// ---------- CORE: rng, level configs, dealing, solver ----------
const TIERS = ['Easy', 'Medium', 'Hard', 'Extra Hard', 'Ultra Hard'];
const MAX_COLOURS = 11;

function rng32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// What a level looks like for a tier (0..4) and level number (1..)
function tierConfig(t, L) {
  // Each tier picks up roughly where the one below leaves off, ramps over ~15 levels, then plateaus.
  let cap, colours, hidden = 0;
  if (t === 0) { cap = 3; colours = clamp(3 + Math.floor((L - 1) / 3), 3, 8); }
  else if (t === 1) { cap = 5; colours = clamp(5 + Math.floor((L - 1) / 5), 5, 8); if (L >= 8 && L % 4 === 0) hidden = 2; }
  else if (t === 2) { cap = 8; colours = clamp(6 + Math.floor((L - 1) / 7), 6, 8); if (L >= 12 && L % 6 === 0) hidden = 2; }
  else if (t === 3) { cap = 8; colours = L < 10 ? 8 : 9; if (L % 4 === 0) hidden = 2; }
  else { cap = 8; colours = L <= 10 ? 10 : 11; if (L % 2 === 0) hidden = 3; }
  return { cap, colours, hidden, empties: 2 };
}

function deal(cfg, seed) {
  const r = rng32(seed);
  const all = [];
  // shuffle which colours appear so every level looks different
  const pal = [];
  for (let i = 0; i < MAX_COLOURS; i++) pal.push(i);
  for (let i = pal.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pal[i], pal[j]] = [pal[j], pal[i]]; }
  for (let c = 0; c < cfg.colours; c++) for (let k = 0; k < cfg.cap; k++) all.push(pal[c]);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const bolts = [];
  for (let b = 0; b < cfg.colours; b++) bolts.push(all.slice(b * cfg.cap, (b + 1) * cfg.cap));
  for (let e = 0; e < cfg.empties; e++) bolts.push([]);
  const hiddenBolts = [];
  const idx = [];
  for (let i = 0; i < cfg.colours; i++) idx.push(i);
  for (let h = 0; h < cfg.hidden && idx.length; h++) hiddenBolts.push(idx.splice(Math.floor(r() * idx.length), 1)[0]);
  return { bolts, hiddenBolts };
}

function runLen(b) {
  let n = 1; const top = b[b.length - 1];
  while (n < b.length && b[b.length - 1 - n] === top) n++;
  return n;
}
function isUniform(b) { for (let i = 1; i < b.length; i++) if (b[i] !== b[0]) return false; return true; }
function isSolved(bolts, N) {
  for (const b of bolts) if (b.length && (b.length !== N || !isUniform(b))) return false;
  return true;
}
// a -> b legal? returns how many nuts move (0 = illegal)
function moveCount(bolts, caps, N, a, b) {
  if (a === b) return 0;
  const A = bolts[a], B = bolts[b];
  if (!A.length) return 0;
  if (A.length === N && isUniform(A)) return 0; // finished bolts are locked
  const space = caps[b] - B.length;
  if (space <= 0) return 0;
  if (B.length && B[B.length - 1] !== A[A.length - 1]) return 0;
  return Math.min(runLen(A), space);
}

// Depth-first solver. Returns list of [from,to] or null if none found in budget.
function solve(startBolts, caps, N, maxNodes) {
  const bolts = startBolts.map(b => b.slice());
  const n = bolts.length;
  const seen = new Set();
  const path = [];
  let nodes = 0;
  const key = () => {
    const parts = [];
    for (let i = 0; i < n; i++) parts.push((caps[i] === N ? '' : caps[i] + ':') + String.fromCharCode.apply(null, bolts[i].map(c => 65 + c)));
    parts.sort();
    return parts.join('|');
  };
  function rec() {
    if (isSolved(bolts, N)) return true;
    if (++nodes > maxNodes) return false;
    const k = key();
    if (seen.has(k)) return false;
    seen.add(k);
    const moves = [];
    let usedEmpty = false;
    for (let a = 0; a < n; a++) {
      const A = bolts[a];
      if (!A.length) continue;
      const run = runLen(A);
      const uniform = run === A.length;
      for (let b = 0; b < n; b++) {
        const k2 = moveCount(bolts, caps, N, a, b);
        if (!k2) continue;
        const B = bolts[b];
        let score;
        if (!B.length) {
          if (uniform) continue;            // pointless shuffle
          if (usedEmpty && caps[b] === N) continue; // all full-size empties are equivalent
          if (caps[b] === N) usedEmpty = true;
          score = 10 - (A.length - run) * 0.1 + (k2 < run ? -20 : 0);
        } else {
          score = 100 + B.length * 2 + (k2 === run ? 50 : -60) + (isUniform(B) ? 30 : 0);
          if (uniform && isUniform(B) && B.length < A.length) score -= 80; // merge small into big instead
        }
        moves.push([score, a, b, k2]);
      }
    }
    moves.sort((x, y) => y[0] - x[0]);
    for (const m of moves) {
      const a = m[1], b = m[2], k2 = m[3];
      for (let i = 0; i < k2; i++) bolts[b].push(bolts[a].pop());
      path.push([a, b, k2]);
      if (rec()) return true;
      path.pop();
      for (let i = 0; i < k2; i++) bolts[a].push(bolts[b].pop());
      if (nodes > maxNodes) return false;
    }
    return false;
  }
  return rec() ? path : null;
}

const GEN_BUDGET = 20000;
// Find the first seed at or after `base` that deals a solvable level.
function findLevel(cfg, base) {
  const caps = [];
  for (let i = 0; i < cfg.colours + cfg.empties; i++) caps.push(cfg.cap);
  for (let s = 0; s < 400; s++) {
    const seed = (base + s * 7919) >>> 0;
    const d = deal(cfg, seed);
    let done = 0;
    for (const b of d.bolts) if (b.length === cfg.cap && isUniform(b)) done++;
    if (done > 0 && cfg.colours > 3) continue;
    const sol = solve(d.bolts, caps, cfg.cap, GEN_BUDGET);
    if (sol) return { seed, bolts: d.bolts, hiddenBolts: d.hiddenBolts, par: sol.length };
  }
  return null;
}
function levelBase(t, L) { return ((t + 1) * 1000003 + L * 7577) >>> 0; }
function dailyBase(dateStr) { let h = 2166136261; for (const ch of dateStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const DAILY_CFG = { cap: 6, colours: 8, hidden: 0, empties: 2 };



// ---------- hint search: weighted A*, finds short, direct solutions ----------
function countRuns(bolts) { let r = 0; for (const b of bolts) for (let i = 0; i < b.length; i++) if (i === 0 || b[i] !== b[i - 1]) r++; return r; }
function bestPath(start, caps, N, budget) {
  const W = 1.2, nc = new Set(start.flat()).size;
  const canon = s => s.map((b, i) => (caps[i] === N ? '' : caps[i] + ':') + b.join(',')).sort().join('|');
  const heap = [];
  const push = x => { heap.push(x); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const t = heap[0], l = heap.pop(); if (heap.length) { heap[0] = l; let i = 0; for (;;) { const a = 2 * i + 1, b = a + 1; let m = i; if (a < heap.length && heap[a].f < heap[m].f) m = a; if (b < heap.length && heap[b].f < heap[m].f) m = b; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return t; };
  const best = new Map([[canon(start), 0]]);
  push({ s: start, g: 0, f: W * (countRuns(start) - nc), path: null });
  let n = 0;
  while (heap.length && n++ < budget) {
    const cur = pop(), s = cur.s;
    if (isSolved(s, N)) { const out = []; for (let p = cur.path; p; p = p.prev) out.push(p.m); return out.reverse(); }
    for (let a = 0; a < s.length; a++) {
      if (!s[a].length) continue;
      const uni = isUniform(s[a]);
      for (let b = 0; b < s.length; b++) {
        const k = moveCount(s, caps, N, a, b);
        if (!k || (!s[b].length && uni)) continue;
        const ns = s.slice(); ns[a] = s[a].slice(0, s[a].length - k); ns[b] = s[b].concat(s[a].slice(s[a].length - k));
        const key = canon(ns), g = cur.g + 1;
        if (best.has(key) && best.get(key) <= g) continue;
        best.set(key, g);
        push({ s: ns, g, f: g + W * (countRuns(ns) - nc), path: { m: [a, b, k], prev: cur.path } });
      }
    }
  }
  return null;
}


// ---------- storage ----------
const TIER_DOT = ['#35c46a', '#25c0f0', '#ffc929', '#ff8a1f', '#e5383b'];
const KEY = 'nuttybolts.v2', MAX_PLAYERS = 8;
let save = { cur: null, players: [], sound: true, unlock: false, p: {} };
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && Array.isArray(s.players)) save = Object.assign(save, s);
  else { // carry over anyone from the test version who has progress
    const old = JSON.parse(localStorage.getItem('nuttybolts.v1'));
    if (old && old.p) for (const n in old.p) {
      const q = old.p[n];
      if (Object.keys(q.lv || {}).length || Object.keys(q.daily || {}).length) { const id = newId(); save.players.push({ id, name: n }); save.p[id] = { lv: q.lv || {}, daily: q.daily || {}, tut: true }; }
    }
    if (old) { save.sound = old.sound !== false; }
  }
} catch (e) {}
function newId() { return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
if (!save.players.find(x => x.id === save.cur)) save.cur = save.players.length ? save.players[0].id : null;
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
const me = () => save.cur ? save.p[save.cur] : null;
const myName = () => { const x = save.players.find(x => x.id === save.cur); return x ? x.name : ''; };
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function tierDone(p, t) { let n = 0, s = 0; if (!p) return [0, 0]; for (const k in p.lv) if (k.startsWith(t + '-')) { n++; s += p.lv[k][0]; } return [n, s]; }

  }
  if (save.players.length < MAX_PLAYERS) {

  for (const bt of buttons) {
    const b = document.createElement('button'); b.className = bt.cls || 'big'; b.textContent = bt.label;
    b.onclick = () => { sfx.ui(); if (bt.fn && bt.fn() === false) return; closeModal(); };

}
function closeModal() { $('modal').classList.remove('on'); }
function askName(title, initial, selfId, onOk) {

    { label: 'Save', fn: () => {

function addPlayer() {
  if (save.players.length >= MAX_PLAYERS) return;
  askName(save.players.length ? 'New player' : "Who's playing?", '', null, name => {
    const id = newId(); save.players.push({ id, name }); save.p[id] = { lv: {}, daily: {}, tut: false };

function editPlayers() {
  const body = save.players.map((x, i) => '<div class="prow"><b>' + esc(x.name) + '</b>' +
    '<button class="pbtn" data-a="ren" data-i="' + i + '">Rename</button><button class="pbtn" data-a="rst" data-i="' + i + '">Reset</button><button class="pbtn red" data-a="del" data-i="' + i + '">Remove</button></div>').join('');
  modal('Players', body, [{ label: 'Done' }]);
  for (const b of $('mBody').querySelectorAll('button')) b.onclick = () => {
    sfx.ui();
    const x = save.players[+b.dataset.i];
    if (b.dataset.a === 'ren') askName('Rename', x.name, x.id, name => { x.name = name; persist(); renderHome(); });
    else if (b.dataset.a === 'rst') confirmBox('Reset ' + x.name + '?', 'This clears all of ' + esc(x.name) + "'s stars and daily scores.", 'Reset', () => { save.p[x.id] = { lv: {}, daily: {}, tut: true }; persist(); renderHome(); });
    else confirmBox('Remove ' + x.name + '?', esc(x.name) + ' and all their progress will be deleted.', 'Remove', () => {
      save.players = save.players.filter(y => y.id !== x.id); delete save.p[x.id];
      if (save.cur === x.id) save.cur = save.players.length ? save.players[0].id : null;

  $('lvTier').textContent = TIERS[curTier];

  const g = $('grid'); g.innerHTML = '';

  const count = Math.max(20, Math.ceil((open + 5) / 5) * 5);
  for (let L = 1; L <= count; L++) {
    const rec = me().lv[curTier + '-' + L];

// ---------- sound ----------
let AC = null, OUT = null, WET = null, NOISE = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.connect(AC.destination);
      OUT = AC.createGain(); OUT.gain.value = 0.9; OUT.connect(comp);
      // small workshop room: generated impulse response
      const len = Math.floor(AC.sampleRate * 0.9), ir = AC.createBuffer(2, len, AC.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
      const conv = AC.createConvolver(); conv.buffer = ir;
      WET = AC.createGain(); WET.gain.value = 0.22; WET.connect(conv); conv.connect(comp);
      NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function env(g, t, vol, dur, attack) {
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function route(g, wet) { g.connect(OUT); if (wet) { const w = AC.createGain(); w.gain.value = wet; g.connect(w); w.connect(WET); } }
// filtered noise burst: clicks, ticks, knocks
function tick(when, freq, q, vol, dur, wet) {
  if (!save.sound || !audio()) return;
  const t = AC.currentTime + when, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  env(g, t, vol, dur, 0.002); src.connect(f); f.connect(g); route(g, wet);
  src.start(t, Math.random() * 0.8, dur + 0.05);
}
// struck metal: a few inharmonic partials, the high ones dying first
const METAL = [[1, 1, 1], [2.76, 0.55, 0.6], [5.4, 0.3, 0.35], [8.93, 0.16, 0.2]];
function ping(when, f0, dur, vol, wet) {
  if (!save.sound || !audio()) return;
  const t = AC.currentTime + when;
  for (const [ratio, amp, life] of METAL) {
    if (f0 * ratio > 15000) continue;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f0 * ratio;
    env(g, t, vol * amp, dur * life, 0.003); o.connect(g); route(g, wet);
    o.start(t); o.stop(t + dur * life + 0.05);
  }
}
function thud(when, f0, vol, dur) {
  if (!save.sound || !audio()) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.4, t + dur);
  env(g, t, vol, dur, 0.004); o.connect(g); route(g, 0.1); o.start(t); o.stop(t + dur + 0.05);
}
// clean, in-tune voice for anything melodic: pure tone with a little octave shine
function note(when, f, dur, vol, wet) {
  if (!save.sound || !audio()) return;
  const t = AC.currentTime + when;
  for (const [ratio, amp, life] of [[1, 1, 1], [2, 0.22, 0.5], [3, 0.06, 0.3]]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f * ratio;
    env(g, t, vol * amp, dur * life, 0.006); o.connect(g); route(g, wet);
    o.start(t); o.stop(t + dur * life + 0.05);
  }
}
// soft sustained chord tone that swells in and fades
function pad(when, f, dur, vol) {
  if (!save.sound || !audio()) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 1600;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.18); g.gain.setValueAtTime(vol, t + dur * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); lp.connect(g); route(g, 0.8); o.start(t); o.stop(t + dur + 0.05);
}
const N_ = { G4: 392, C5: 523.25, E5: 659.25, G5: 783.99, B5: 987.77, C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98, C7: 2093 };
const jit = () => 0.94 + Math.random() * 0.12;
const sfx = {
  ui() { tick(0, 2400, 3, 0.25, 0.03); },
  // nut spinning along the thread: dir -1 unscrewing (pitch climbs), +1 screwing down (pitch drops)
  ratchet(n, when, dir) {
    for (let i = 0; i < n; i++) {
      const p = n > 1 ? i / (n - 1) : 0, f = dir < 0 ? 2300 + 1500 * p : 3800 - 1500 * p;
      tick((when || 0) + i * 0.024, f * jit(), 9, 0.3, 0.022, 0.15);
    }
  },
  pick() { const k = jit(); ping(0, 1480 * k, 0.22, 0.13, 0.5); tick(0, 3200, 4, 0.22, 0.025); this.ratchet(5, 0.015, -1); },
  drop() { this.ratchet(4, 0, 1); tick(0.1, 900, 2, 0.3, 0.05); ping(0.1, 760 * jit(), 0.12, 0.07, 0.3); },
  land(when, depth) { // lower on the bolt = deeper clank
    const k = jit() * (1.15 - 0.05 * Math.min(6, depth || 0));
    thud(when, 150, 0.5, 0.13); ping(when, 640 * k, 0.3, 0.16, 0.6); tick(when, 2600, 2.5, 0.35, 0.035, 0.3);
  },
  bad() { tick(0, 260, 3, 0.7, 0.07); tick(0.09, 210, 3, 0.6, 0.08); thud(0, 110, 0.25, 0.1); },
  reveal(when) { ping(when, 2100, 0.3, 0.07, 0.8); ping(when + 0.07, 2800, 0.35, 0.06, 0.8); },
  // bolt finished: the same clean three-note chime every time
  done(when) {
    this.ratchet(6, when, 1);
    const t = when + 0.16;
    thud(t, 130, 0.35, 0.16);
    note(t, N_.G5, 0.5, 0.2, 0.7); note(t + 0.075, N_.C6, 0.55, 0.2, 0.7); note(t + 0.15, N_.E6, 0.9, 0.22, 0.9);
  },
  // level cleared: soft chord swell, a rising run of clean notes, one bright note to finish
  win() {
    for (const f of [N_.C5 / 2, N_.G4, N_.C5, N_.E5]) pad(0, f, 2.2, 0.085);
    thud(0, 98, 0.4, 0.35);
    [N_.C5, N_.E5, N_.G5, N_.B5, N_.D6, N_.G6].forEach((f, i) => note(0.08 + i * 0.095, f, 0.7, 0.15, 0.8));
    note(0.75, N_.C7, 1.6, 0.13, 1); note(0.75, N_.E6, 1.6, 0.1, 1);
  },
  star(i) { note(0, [N_.E6, N_.G6, N_.C7][i], 0.8, 0.17, 0.9); },
  add() { tick(0, 1800, 3, 0.3, 0.03); ping(0.03, 520, 0.35, 0.14, 0.6); ping(0.12, 780, 0.45, 0.12, 0.7); },
  hint() { ping(0, 1319, 0.5, 0.1, 0.8); ping(0.11, 1760, 0.6, 0.1, 0.8); }
};

  }));

// ---------- layout ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 40, NH = 16;
const SQ = 0.30;
function resize() {
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (G) layout();
}
window.addEventListener('resize', resize);
function layout() {
  if (!G || !W) return;
  const n = G.bolts.length, N = G.N, rowUnits = (N + 4.1) * 0.40;
  let best = null;
  for (let rows = 1; rows <= 4; rows++) {
    const per = Math.ceil(n / rows);
    const u = Math.min(W / (per * 1.38 + 0.25), H / (rows * rowUnits), 96);
    if (!best || u > best.u + 0.01) best = { rows, per, u };
  }
  U = best.u; NH = U * 0.40;
  const rowH = rowUnits * U, top = (H - best.rows * rowH) / 2;
  let i = 0;
  for (let r = 0; r < best.rows; r++) {
    const cnt = Math.min(best.per, n - i);
    const cell = Math.min(W / cnt, U * 2.0);
    const x0 = W / 2 - cell * (cnt - 1) / 2;
    for (let k = 0; k < cnt; k++, i++) {
      const b = G.bolts[i];
      b.x = x0 + k * cell; b.row = r;
      b.baseY = top + r * rowH + (2.0 + 0.7 + N) * NH;
    }
  }
  G.rows = best.rows; G.rowH = rowH; G.top = top;
}
const TIP = 0.3; // how much thread shows above a full bolt, in nut heights
const rodTop = b => b.baseY - (b.cap + TIP) * NH;
const hoverY = b => rodTop(b) - 1.7 * NH;
const slotY = (b, j) => b.baseY - (j + 1) * NH;

// ---------- moves ----------
function animRod(b, bi, y0, y1) { const d = Math.abs(y1 - y0); return { type: 'rod', bolt: bi, x0: b.x, x1: b.x, y0, y1, dur: 70 + d * 0.9, rounds: Math.max(1, Math.round(d / NH)) }; }
function liftNut(bi) {
  const b = G.bolts[bi], nut = b.nuts[b.nuts.length - 1];
  nut.lifted = true;
  nut.anim = { start: performance.now(), segs: [animRod(b, bi, slotY(b, b.nuts.length - 1), hoverY(b))], dir: -1 };
  G.sel = bi; sfx.pick();
}
function dropNut() {
  if (G.sel < 0) return;
  const b = G.bolts[G.sel], nut = b.nuts[b.nuts.length - 1];
  nut.lifted = false;
  nut.anim = { start: performance.now(), segs: [animRod(b, G.sel, nut.py || hoverY(b), slotY(b, b.nuts.length - 1))], dir: 1 };
  G.sel = -1; sfx.drop();
}
function tapBolt(i) {
  if (!G || G.won) return;

      drawNut(p.x, p.y, p.ang, p.nut, now, glow);
      if (!b.done) drawRod(b.x, rodTop(b), p.y + U * 0.03, true);
    }
    if (b.done) { // capped bolt
      const pop = dp < 0 ? 0 : dp < 260 ? (dp / 260) * 1.35 : dp < 420 ? 1.35 - (dp - 260) / 160 * 0.35 : 1;
      const y = slotY(b, G.N - 1), r = U * 0.25 * pop;
      if (dp < 0) drawRod(b.x, rodTop(b), y + U * 0.03, true);
      const g = ctx.createRadialGradient(b.x - r * 0.3, y - r * 0.5, 1, b.x, y, r * 1.2);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa3b1');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(b.x, y, r, r * 0.62, 0, Math.PI, 0); ctx.ellipse(b.x, y, r, r * SQ, 0, 0, Math.PI); ctx.fill();
      for (const lag of [0, 180]) { const p = (dp - lag) / 600;
        if (p > 0 && p < 1) { ctx.strokeStyle = 'rgba(255,255,255,' + (1 - p) * 0.9 + ')'; ctx.lineWidth = 4 * (1 - p) + 1; ctx.beginPath(); ctx.ellipse(b.x, b.baseY - G.N * NH / 2, U * (0.6 + p * 0.9), G.N * NH * (0.55 + p * 0.35), 0, 0, Math.PI * 2); ctx.stroke(); } }
    }
    if (b.bonus && b.cap < G.N && !b.nuts.length) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '700 ' + Math.max(9, U * 0.2) + 'px ui-rounded,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('holds ' + b.cap, b.x, b.baseY + U * 0.5); }
    ctx.restore();
  });
  for (const p of flying) drawNut(p.x, p.y, p.ang, p.nut, now);
  if (G.tut && TUT_STEPS[G.tut.step]) {
    const b = G.bolts[TUT_STEPS[G.tut.step].at], k = Math.sin(now / 170);
    ctx.strokeStyle = 'rgba(255,217,90,' + (0.7 + 0.3 * k) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(b.x, b.baseY, U * (0.78 + 0.05 * k), U * 0.78 * SQ * 1.3, 0, 0, Math.PI * 2); ctx.stroke();
    const ay = hoverY(b) - NH * 1.2 + k * 6, s2 = U * 0.22;
    ctx.fillStyle = '#ffd95a'; ctx.beginPath(); ctx.moveTo(b.x - s2, ay - s2); ctx.lineTo(b.x + s2, ay - s2); ctx.lineTo(b.x, ay + s2 * 0.6); ctx.closePath(); ctx.fill();
  }
  if (G.hint) {
    const a = G.bolts[G.hint.a], b = G.bolts[G.hint.b], k = Math.sin((now - G.hint.t) / 170);
    if (a && b) {
      ctx.strokeStyle = 'rgba(255,217,90,' + (0.65 + 0.3 * k) + ')'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      for (const q of [a, b]) { ctx.beginPath(); ctx.ellipse(q.x, q.baseY, U * 0.72, U * 0.72 * SQ * 1.3, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd95a'; ctx.font = '900 ' + (U * 0.34) + 'px ui-rounded,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.textBaseline = 'top'; ctx.fillText('FROM', a.x, a.baseY + U * 0.34 + k); ctx.fillText('TO', b.x, b.baseY + U * 0.34 - k);
    }
  }
  if (G.riseUntil && now < G.riseUntil) for (const b of G.bolts) if (b.nuts.length && Math.random() < 0.3) // soft lights drifting up off each bolt
    G.fx.push({ x: b.x + (Math.random() - 0.5) * U * 0.9, y: b.baseY - Math.random() * G.N * NH, vx: (Math.random() - 0.5) * 0.3, vy: -0.8 - Math.random() * 1.6, col: Math.random() < 0.4 ? '#ffffff' : COLOURS[b.nuts[0].c],
      life: 0.9, decay: 0.014, r: 1.5 + Math.random() * 2.5, dot: true, rot: 0, vr: 0, g: -0.012 });
  G.fx = G.fx.filter(f => f.life > 0 && f.y < H + 20 && f.y > -30);
  for (const f of G.fx) {
    f.x += f.vx + (f.flut !== undefined ? Math.sin(now / 180 + f.flut) * 0.8 : 0); f.y += f.vy; f.vy += f.g; f.vx *= 0.985; f.life -= f.decay; f.rot += f.vr;
    ctx.globalAlpha = Math.min(1, Math.max(0, f.life * 2.2)); ctx.fillStyle = f.col;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    if (f.dot) { ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill(); } else if (f.star) sym(9, f.r * 1.3); else ctx.fillRect(-f.r, -f.r * 0.6, f.r * 2, f.r * 1.2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
document.addEventListener('gesturestart', e => e.preventDefault());
renderHome();
requestAnimationFrame(frame);
// offline: cache the game so it opens without a connection
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
